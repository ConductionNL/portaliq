# gitleaks configuration: the default rules, plus allowlists for findings
# that are not secrets. Each allowlist names the exact files and only the
# rules that fire there, so anything else in those files is still reported.

[extend]
useDefault = true

[[allowlists]]
description = "Documentation examples: the default admin:admin login of the local development and demo containers."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)docs/Installation/demo\-environment\.md$''',
]

[[allowlists]]
description = "Demo seed data: tokenHash holds SHA-256 hashes of demo invitation tokens, and the key fields are human-readable slugs; none is a credential."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)lib/Settings/example\-sets/zuiddrecht\.d/20\-samenwerken\.json$''',
  '''(^|/)lib/Settings/example\-sets/zuiddrecht\.d/30\-portal\-boards\.json$''',
  '''(^|/)lib/Settings/example\-sets/zuiddrecht\.json$''',
]

[[allowlists]]
description = "Mock register data: tokenHash holds SHA-256 hashes of demo invitation tokens, not the tokens and not credentials."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)lib/Settings/portaliq_mock_register\.json$''',
]

[[allowlists]]
description = "Test fixtures: a fixed example UUID as submission key and placeholder secrets (ABCD...) that exist only inside the tests."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)tests/Fixtures/Golden/portal\-api\.json$''',
  '''(^|/)tests/Unit/Service/Identity/WaitingAccountInvitationTest\.php$''',
  '''(^|/)tests/fixtures/post\-action\-golden\.json$''',
  '''(^|/)tests/golden/portal\-api\.golden\.spec\.mjs$''',
  '''(^|/)tests/submission\-key\.spec\.mjs$''',
  '''(^|/)tests/woo\-entry\-points\.spec\.mjs$''',
]

[[allowlists]]
description = "CI seed script: curl reads the admin login from environment variables; no value is in the file."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)tests/e2e/ci\-seed\.sh$''',
]
