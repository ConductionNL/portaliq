developmentStatus: development

description:
  en:
    localisedName: "Portaliq"
    shortDescription: "One shared external portal for clients and suppliers"
    longDescription: |
      Portaliq is the shared external portal of the Conduction app suite.
      Clients (citizens) and suppliers (companies) get one integrated,
      white-label portal to see and act on their records across every app.
      Portaliq reads the data through OpenRegister and renders the portal
      contribution of each app. It owns the external login (DigiD,
      eHerkenning, eIDAS), the white-label portal shell, the unified inbox
      and the register of portal contributions. Employees keep working in
      the internal apps.
    features:
      - External login with DigiD, eHerkenning and eIDAS
      - White-label portal shell with its own domain and theme
      - Unified inbox for clients and suppliers
      - Portal contributions from every app in the suite
      - Data read and written through OpenRegister
  nl:
    localisedName: "Portaliq"
    shortDescription: "Eén gedeeld extern portaal voor klanten en leveranciers"
    longDescription: |
      Portaliq is het gedeelde externe portaal van de Conduction-appsuite.
      Klanten (burgers) en leveranciers (bedrijven) krijgen één
      geïntegreerd, white-label portaal waarin ze hun gegevens uit alle apps
      inzien en er acties op uitvoeren. Portaliq haalt de gegevens op via
      OpenRegister en toont de portaalbijdrage van elke app. Portaliq
      verzorgt de externe inlog (DigiD, eHerkenning, eIDAS), de white-label
      portaalschil, de gebundelde berichtenbox en het register van
      portaalbijdragen. Medewerkers blijven werken in de interne apps.
    features:
      - Externe inlog met DigiD, eHerkenning en eIDAS
      - White-label portaalschil met een eigen domein en thema
      - Gebundelde berichtenbox voor klanten en leveranciers
      - Portaalbijdragen van elke app in de suite
      - Gegevens lezen en schrijven via OpenRegister

