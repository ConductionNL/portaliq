version = 1
SPDX-PackageName = "portaliq"
SPDX-PackageSupplier = "Conduction B.V. <info@conduction.nl>"
SPDX-PackageDownloadLocation = "https://github.com/ConductionNL/portaliq"

# REUSE compliance for Portaliq.
#
# PHP files carry SPDX-FileCopyrightText / SPDX-License-Identifier inside the
# main file docblock (alongside the @license / @copyright / @author PHPDoc
# tags) per ADR-014. This REUSE.toml provides the same metadata for non-PHP
# source files that have no docblock to carry it, plus a fallback for any
# PHP file that has not yet had its SPDX header added.
#
# WHY EVERY ENTRY CARRIES `precedence` (added 2026-09-11, corrected 2026-09-14).
#
# This comment used to say that without `precedence` a REUSE.toml entry
# silently overrules a header the file itself carries. That is not true, and it
# is worth stating plainly because the next person will reason from these lines.
# `closest` is the DEFAULT in REUSE 3.3 -- a file's own header (or its .license
# companion) already wins over any table here. The seven `closest` keys below
# are therefore no-ops that state the intent explicitly; removing all seven
# leaves `reuse lint --json` byte-identical, which is how this was checked.
#
# `override` is the real switch: it discards whatever the file itself says. So
# every override in this file is a provenance claim that has to be verified
# against upstream before it is written -- and one of them was wrong on the
# first attempt (see the MaxMind block). Treat them as the load-bearing lines
# they are, not as bookkeeping.
#
# Same model as @conduction/nextcloud-vue's REUSE.toml, which documents this
# correctly, and as keepiq's, which uses the `path = "**"` blanket shape.
#
# THE BLANKET, AND WHY IT COULD ONLY LAND NOW (2026-09-17).
#
# `path = "**"` below is the shape keepiq and nextcloud-vue use, and Remko
# Huisman asked for it twice, on #521 and #553. It is a PREPEND: every table
# after it still wins for the paths it names, because the last matching table
# wins (REUSE 3.3 §3.3). What it adds is a floor -- a file whose extension
# nobody listed no longer falls through as unlicensed.
#
# It was deliberately held back while twelve fonts under woo/ carried no
# licensing information, because it would have stamped them EUPL-1.2 and
# flipped `compliant` to true without anyone having decided anything. Six of
# those were commercial or all-rights-reserved faces we hold no licence to
# redistribute (3x Gill Sans, Avenir LT, Tisa Sans Pro, Eau Sans Book). On
# 2026-09-17 Ruben van der Linde decided they come out, and they did -- from
# woo/, from the service-worker precache, from asset-manifest.json and from
# the @font-face rules -- so there is nothing left for a blanket to cover
# dishonestly. Since 2026-11-12 woo/ is not committed at all: the bundle and
# its licensing (REUSE.toml and LICENSES/ inside the archive) arrive from the
# release pinned in scripts/woo-bundle.json.

# ---------------------------------------------------------------------------
# First-party source.
# ---------------------------------------------------------------------------
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Conduction B.V. <info@conduction.nl>"
SPDX-License-Identifier = "EUPL-1.2"

[[annotations]]
path = "**/*.php"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Conduction B.V. <info@conduction.nl>"
SPDX-License-Identifier = "EUPL-1.2"

# `.jsx` and `.mjs` were missing here, which is why the nine sources of the
# since retired React portal and docs/scripts/validate-ai-baseline.mjs counted
# as unlicensed: this file lists extensions rather than using a blanket, so an
# extension that is not listed falls through entirely.
[[annotations]]
path = [
    "**/*.vue",
    "**/*.js",
    "**/*.jsx",
    "**/*.mjs",
    "**/*.ts",
    "**/*.css",
    "**/*.scss",
    "**/*.sh",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Conduction B.V. <info@conduction.nl>"
SPDX-License-Identifier = "EUPL-1.2"

# Config / data / generated files — CC0 (same treatment as many
# upstream Nextcloud apps). Adjust if a specific asset warrants a
# different licence.
[[annotations]]
path = [
    "**/*.json",
    "**/*.yml",
    "**/*.yaml",
    "**/*.xml",
    "**/*.md",
    "img/**",
    "l10n/**",
    "composer.lock",
    "package-lock.json",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Conduction B.V. <info@conduction.nl>"
SPDX-License-Identifier = "CC0-1.0"

# Repository plumbing that carries no comment syntax of its own: dotfiles,
# tool baselines, the Makefile, CODEOWNERS, the docs site's CNAME. Same CC0
# treatment as the config block above — none of this is creative work.
#
# `.editorconfig` is deliberately NOT in this list: it carries a Nextcloud
# AGPL-3.0-or-later header of its own and resolves correctly without us. An
# entry here would be a dead line that still reads as a claim.
[[annotations]]
path = [
    ".gitattributes",
    ".gitignore",
    ".git-blame-ignore-revs",
    ".npmrc",
    ".nvmrc",
    ".prettierignore",
    ".coverage-baseline",
    ".github/CODEOWNERS",
    ".githooks/**",
    "Makefile",
    "**/*.neon",
    "**/.gitkeep",
    "docs/static/CNAME",
    "docs/static/llms.txt",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Conduction B.V. <info@conduction.nl>"
SPDX-License-Identifier = "CC0-1.0"

# Screenshots and logo on the docs site: our own product, our own images.
[[annotations]]
path = [
    "docs/static/img/**",
    "docs/static/screenshots/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Conduction B.V. <info@conduction.nl>"
SPDX-License-Identifier = "CC0-1.0"

# ---------------------------------------------------------------------------
# Third party. NOT ours — these say what upstream says, and they use
# `override` because a .woff2 or an .mmdb cannot carry a text header.
# ---------------------------------------------------------------------------

# Roboto, bundled for the site renderer. Apache-2.0 per the licence text that
# ships next to it in css/fonts/LICENSE-roboto.txt.
[[annotations]]
path = "css/fonts/roboto-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "Apache-2.0"

# MaxMind's GeoIP2 test database and the licence text that ships beside it.
# Apache-2.0 OR MIT, per https://github.com/maxmind/MaxMind-DB, which ships
# LICENSE-APACHE and LICENSE-MIT and states "at your option". Our fixture is
# byte-identical to that repository's test-data/GeoIP2-City-Test.mmdb
# (git blob e20846ac1757a3745ae41411757ed3817536e3be).
#
# This previously said CC-BY-SA-4.0. That is the licence of MaxMind's GeoLite2
# PRODUCTION databases, a different product under a different agreement; the
# two were conflated. The licence text sitting next to the fixture said so all
# along. An `override` discards whatever the file itself states, so a wrong one
# is unrecoverable by design -- check upstream before writing one.
#
# The .LICENSE.md is covered here too. Without it, it falls through to the
# **/*.md rule below and MaxMind's own licence text gets labelled as
# Conduction's CC0 work -- exactly the misrepresentation this file refuses to
# make for woo/'s third-party notices.
#
# LICENSES/MIT.txt IS SUPPOSED TO READ AS A TEMPLATE. It carries the SPDX
# placeholder line, `Copyright (c) <year> <copyright holders>`, because that is
# what `reuse download MIT` emits and what the standard licence text is. Do not
# "finish" it by inserting Conduction's name: the only MIT grant in this
# repository is MaxMind's, and the copyright holder for it is stated above, in
# the annotation -- which is exactly where REUSE expects to find it. Noted
# because it looks like an oversight and is not. Raised by Remko Huisman.
[[annotations]]
path = [
    "tests/fixtures/GeoIP2-City-Test.mmdb",
    "tests/fixtures/GeoIP2-City-Test.LICENSE.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2013-2026 MaxMind, Inc."
SPDX-License-Identifier = "Apache-2.0 OR MIT"
