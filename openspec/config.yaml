schema: conduction

context: |
  Project: Portaliq
  Repo: ConductionNL/portaliq
  Type: Nextcloud App (PHP backend + Vue 3 frontend)
  Description: The fleet's shared external portal. Clients (citizens) and
    suppliers (companies) get one integrated, white-label portal to see and act
    on their records across every app, reading data through OpenRegister and
    rendering each app's registered portal contribution. Portaliq owns the
    external auth edge (DigiD / eHerkenning / eIDAS), the white-label portal
    shell, the unified inbox, and the portal-contribution registry. Employees
    stay internal. See ADR-046.
  Key components: portal auth edge (sessions, OIDC broker), portal-contribution
    registry, unified inbox, documents, WOO SPA, admin settings
  Database: PostgreSQL (via OpenRegister's ObjectService)
  Mount path: /var/www/html/custom_apps/portaliq
  Nextcloud: min-version 32, max-version 34

  Architecture:
    Pattern: Thin client — Portaliq owns no database tables
    Data layer: OpenRegister (JSON object storage with schema validation)
    Frontend: Vue 3.5 + Pinia stores querying OpenRegister API directly
    Backend: 10 controllers / 21 services — the portal auth edge and the
      contribution contract, not a thin settings shim

  Shared specs: See ../openspec/specs/ for cross-project conventions
  Project guidelines: See ../project.md for workspace-wide standards

rules:
  proposal:
    - Reference shared nextcloud-app spec for app structure requirements
    - Consider impact on other Conduction apps
  specs:
    - Use Schema.org type annotations for all entities
    - Specify which Nextcloud OCP interfaces are used for integration features
  design:
    - Uses OpenRegister API directly from frontend (no own backend CRUD)
    - Register config in lib/Settings/app_template_register.json (OpenAPI 3.0.0 format)
    - Imported via ConfigurationService::importFromApp() in repair step
  tasks:
    - Test with OpenRegister to verify schema validation works
  review:
    - Cross-reference shared specs (nextcloud-app, api-patterns, nl-design, docker)
    - Flag spec deviations with WARNING and justification
