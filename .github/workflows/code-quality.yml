name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, master, development, beta]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Permission CEILING for the called quality pipeline. GitHub statically
# validates the called workflow's declared job permissions against this
# grant — even for jobs that are disabled — so it must cover the maximum
# any nested job declares: journeydoc-capture (contents+actions write),
# update-baseline / features-extract (contents write), and the Quality
# Report PR comment (issues / pull-requests write).
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  quality:
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: portaliq
      php-version: "8.3"
      php-test-versions: '["8.3", "8.4"]'
      nextcloud-test-refs: '["stable31", "stable32", "stable33"]'
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      enable-phpunit: true
      enable-newman: true
      # Portaliq cannot be exercised without OpenRegister: its register,
      # schemas and every portal collection/action live there, and
      # `PortalContributionProvider` is config-driven off `portalPage` OBJECTS
      # (portal-page-provisioning) — with no OpenRegister the portal renders an
      # empty shell. Pinned to `development`, not `main`: this app tracks
      # `development`, and pinning the foundation to `main` makes a CI instance
      # behave unlike any environment the app is actually developed against.
      additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"development"}]'
      enable-sbom: true
      # Run the Hydra mechanical quality gates against this PR's diff.
      #
      # This tier has never executed in this repository. `enable-hydra-gates`
      # defaults to false, so `quality / Hydra Gates` has been SKIPPED on every
      # run here — and a skipped job is neither a pass nor a failure in the
      # Quality Report rollup, so its absence has been indistinguishable from
      # its success.
      #
      # Measured before switching on, not assumed. Running the v1.0.1 package
      # locally against this repo's most recent merged PR diff reported ALL
      # GATES PASSED (58 of 61 reporting; 4, 24 and 33 have no prerequisite
      # here), and the whole-tree gate-61 audit finds no object-lifecycle
      # listener debt in this repo at all.
      #
      # No count is written here on purpose: the number of gates depends on the
      # pin below and the number that run depends on this repo's diff and
      # toolchain. The package prints both (`COVERAGE: N of M`) in the job log.
      # See https://github.com/ConductionNL/.github/tree/main/hydra-gates
      #
      # Pinned to a tag, not `main`, so a change to the gate package cannot
      # alter this repository's verdict without a commit here to move the pin.
      # v1.0.1 was the pin openbuild and openregister ran when this was written.
      enable-hydra-gates: true
      # PIN MOVED v1.0.1 -> v1.3.0. `hydra-gates-require-full-coverage`
      # (default ON) fails a run when a gate whose subject matter EXISTS did
      # not report; its contract is that a not-applicable gate must DECLARE
      # itself. v1.0.1 contains ZERO `_skip` calls — no na/structural/wiring
      # vocabulary at all — so such a gate emits NOTHING and is counted as
      # "DID NOT RUN". v1.3.0 ships 36 such declarations. Measured on doriath
      # (PR #160): gates 4/24/33 went from unexplained "DID NOT RUN" to
      # explicit NOT APPLICABLE, and Hydra Gates went failure -> success.
      hydra-gates-ref: v1.3.0
      # `enable-axe` deliberately NOT set: it produces the report gate-33
      # consumes, and a vanilla Nextcloud already carries serious/critical axe
      # violations, so enabling it here would mix "this repo has a defect" with
      # "core does". Separate change. gate-33 reports SKIPPED meanwhile.

      # ── E2E browser tests ────────────────────────────────────────────────
      # Previously OFF (`additional-apps` was commented out entirely, so the
      # job could not have worked even if enabled). Turned on together with
      # tests/e2e/ci-seed.sh, which provisions the three things a fresh CI
      # instance is missing and each of which fails SILENTLY:
      #
      #  1. The register + schemas + seed `portalPage` objects. The
      #     `InitializeSettings` repair step is not a reliable sole path — it
      #     calls `loadConfiguration(force: false)` (version-guarded) and
      #     catches every \Throwable as a warning, so `occ app:enable portaliq`
      #     exits 0 whether or not anything was imported. ci-seed.sh imports
      #     explicitly over the admin HTTP API (forced) and then VERIFIES the
      #     register slug, the nine schema slugs, and the active portalPage
      #     rows.
      #  2. `portaliq/dev_login_enabled`. Every portal spec mints its bearer
      #     through the debug-gated `POST /portal/api/session/dev-login`, which
      #     404s on a default instance. ci-seed.sh sets the DEDICATED app flag
      #     (not blanket system `debug`, which would change error rendering and
      #     log verbosity instance-wide) and then probes the endpoint.
      #  3. Nothing, for `jwt_signing_secret` — that one is VERIFIED, never
      #     generated, so a broken install path cannot hide behind a green run.
      enable-playwright: true
      # Double duty in the shared workflow: it is both the directory the
      # "Validate Playwright tests exist" step counts *.spec.ts in, AND the
      # FIRST place the run step looks for a config
      # (`${playwright-test-path}/playwright.config.ts`), falling back to the
      # repo root only if that file is absent. We ship
      # tests/e2e/playwright.config.ts precisely so that lookup hits it: the run
      # step passes no `--project`, so the ROOT config would also run
      # `docs-capture` and re-shoot every documentation screenshot on every PR.
      # The root config is untouched — the separate `Journeydoc Capture` job
      # requires it to keep declaring that project.
      playwright-test-path: tests/e2e
      # cwd for this step is the Nextcloud server root, which is also what makes
      # `php occ` directly runnable inside the script.
      playwright-seed-command: 'bash apps/portaliq/tests/e2e/ci-seed.sh'

      # ── Frontend Check legs ──────────────────────────────────────────────
      # `frontend-checks` defaults to `[]`, and an empty list means the shared
      # workflow emits NO "Frontend Check" job at all — so this repo's validator
      # family ran nowhere while the run still looked complete.
      # `check:specs` is the aggregate (json-strict + manifest-v2 + register +
      # registry), listed as ONE leg rather than four because each leg is a
      # fresh job with its own checkout + `npm ci`. `check:manifest` is separate:
      # it is not part of that aggregate.
      # Measured on this tree before enabling: `check:specs` PASSES,
      # `check:manifest` FAILS (`pages[10].type: "roadmap" not in v1.1 enum`) —
      # the same defect reproduces in 10 other fleet repos.
      frontend-checks: '["check:specs", "check:manifest"]'

      # ── Coverage ratchet ─────────────────────────────────────────────────
      # `enable-coverage-guard` defaults to FALSE, which is why both
      # "Coverage Baseline Protection" and "Coverage Baseline Check" have only
      # ever reported `skipped`. It needs two inputs this repo did not have,
      # both added in this commit: `scripts/coverage-guard.php` (byte-identical
      # to openregister's) and `.coverage-baseline` = 79.28, this repo's own
      # measured coverage (2674 of 3373 statements) read from clover.xml in the
      # `coverage-report` artifact of run 30917641977.
      enable-coverage-guard: true
