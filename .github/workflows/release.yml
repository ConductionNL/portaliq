name: Release

# ONE release workflow for the whole fleet.
#
# Every app used to carry three caller files (`release-development.yml`,
# `release-beta.yml`, `release-stable.yml`) pointing at two different shared
# workflows. Those two drifted: the pair edited `appinfo/info.xml` in the
# working tree only, so their tags named commits still showing the PREVIOUS
# version — harmless for a timestamped dev build, wrong for a stable release,
# because Nextcloud's release template asserts
#     [ "$APP_VERSION" = "v$(xpath info.xml //version)" ]
#
# `release.yml` is the strict one and is now the only one. It commits the bump
# to a `release/v<version>` branch, tags THAT commit, and opens a pull request
# to bring the integration branch up — so the tag and the package agree without
# anything pushing at a protected branch.
#
# NODE 24, AND THE REASON IS npm, NOT NODE.
#
# The shared workflow still defaults `node-version` to 22, and every Node 22
# release bundles npm 10 (22.23.2 ships 10.9.8). This repo's `.npmrc` uses
# `min-release-age`, an npm 11+ feature, and `engines.npm` declares `^11.0.0`.
# On npm 10 `npm ci` does not warn that it is the wrong major — it fails with
# a lockfile error naming a package nothing here depends on directly:
#
#   npm error `npm ci` can only install packages when your package.json and
#   npm error package-lock.json ... are in sync.
#   npm error Missing: pinia@4.0.3 from lock file
#
# The lock is fine. EVERY Release run on this repo had failed this way —
# beta and development alike — while Code Quality stayed green, because
# quality.yml already defaults to 24. The two shared workflows drifted and
# release.yml's own comment still claims it is "kept in step".
#
# opencatalogi measured both sides on identical bytes (2026-08-17, bc9136c5):
#   npm 10.9.8 / Node 22  -> EUSAGE, Missing: pinia@4.0.3
#   npm 11.17.0 / Node 24 -> clean, 1929 packages
# Removing .npmrc changes neither result, so the cooldown is not the cause.
#
# Keep this in step with quality.yml's node-version. If the shared workflow's
# default moves to 24, these three lines become redundant rather than wrong.

on:
  push:
    branches: [main, beta, development]
  workflow_dispatch:

# Releases publish artifacts. A cancelled release is neither a success nor a
# rollback — it is a half-published version — so queued runs wait rather than
# cancelling the one in flight.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  unstable:
    if: github.ref == 'refs/heads/development'
    uses: ConductionNL/.github/.github/workflows/release.yml@main
    with:
      release-type: unstable
      app-name: portaliq
      node-version: "24"
    secrets: inherit

  beta:
    if: github.ref == 'refs/heads/beta'
    uses: ConductionNL/.github/.github/workflows/release.yml@main
    with:
      release-type: beta
      app-name: portaliq
      node-version: "24"
    secrets: inherit

  stable:
    if: github.ref == 'refs/heads/main'
    uses: ConductionNL/.github/.github/workflows/release.yml@main
    with:
      release-type: stable
      app-name: portaliq
      node-version: "24"
    secrets: inherit
